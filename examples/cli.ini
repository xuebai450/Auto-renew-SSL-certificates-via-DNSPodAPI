# /etc/letsencrypt/cli.ini — certbot global configuration
# Copy this file to /etc/letsencrypt/cli.ini

# Use logrotate instead of internal log rotation
max-log-backups = 0

# Adjust interactive output regarding automated renewal
# NOTE: requires certbot >= 2.5. deploy.sh strips this line automatically
# when an older certbot is detected (older versions reject unknown options).
preconfigured-renewal = True
